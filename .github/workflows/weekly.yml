name: Weekly chess refresh
on:
  schedule:
    - cron: "0 23 * * 0"   # Sunday 23:00 UTC (~7pm US Eastern). Adjust to your timezone.
  workflow_dispatch: {}     # allows manual runs
jobs:
  refresh:
    runs-on: ubuntu-latest
    # Job-level env so the publish step's `if:` can see it (a step's own `env:`
    # block is NOT visible to that step's `if:` condition).
    env:
      CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install Stockfish + Python deps
        run: |
          sudo apt-get update && sudo apt-get install -y stockfish
          pip install -r tools/requirements.txt
      - name: Pull latest blitz games from Lichess
        run: |
          curl -s "https://lichess.org/api/games/user/jbensamo?max=60&perfType=blitz&clocks=true&evals=true&opening=true" -o data/games/blitz_latest.pgn
          echo "games:"; grep -c '\[Event ' data/games/blitz_latest.pgn || true
      - name: Analyze (ACPL / blunders vs baseline)
        run: python tools/analyze.py data/games/blitz_latest.pgn jbensamo | tee data/last_report.txt
      # Build BOTH sets from the newest games and merge them into the existing library.
      # The id prefix is date-stamped so weekly runs never collide with earlier ids
      # (progress is keyed by id, so a collision would mark new puzzles as solved), and
      # merge_sets.py drops any position already present, so repeats don't accumulate.
      - name: Regenerate puzzle sets from newest blunders
        run: |
          set -e
          STAMP=$(date -u +%y%m%d)
          mkdir -p build/sets
          CACHE=build/sets/cand_end.json OUT=build/sets/end_new.json \
          ID_PREFIX="e${STAMP}_" CAT=endgame PHASE_ONLY=endgame \
          MAX_PUZZLES=10 MAX_PER_GAME=2 WALL=700 \
          python tools/generate_puzzles.py data/games/blitz_latest.pgn
          CACHE=build/sets/cand_tac.json OUT=build/sets/tac_new.json \
          ID_PREFIX="t${STAMP}_" CAT=tactics \
          MAX_PUZZLES=14 MAX_PER_GAME=2 WALL=700 \
          python tools/generate_puzzles.py data/games/blitz_latest.pgn
      - name: Merge into the puzzle library
        run: |
          python tools/merge_sets.py build/sets
          python build.py          # re-embed the offline fallback
      - name: Publish fresh puzzles to Cloudflare KV
        if: ${{ env.CF_WORKER_URL != '' && env.ADMIN_TOKEN != '' }}
        run: python tools/publish_puzzles.py puzzles.json
      - name: Commit refreshed data
        run: |
          git config user.name "blitz-climb-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -m "weekly refresh $(date -u +%F)" || echo "no changes"
          git push || echo "push skipped (no perms)"
